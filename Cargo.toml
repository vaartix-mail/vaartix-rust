[package]
name = "vaartix"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "The official Rust client for Vaartix, the transactional email API built in India."
license = "MIT"
repository = "https://github.com/vaartix-mail/vaartix-rust"
homepage = "https://vaartix.com"
documentation = "https://docs.rs/vaartix"
readme = "README.md"
keywords = ["email", "transactional-email", "smtp", "api", "vaartix"]
categories = ["email", "api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.13"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
